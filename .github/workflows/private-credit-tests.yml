name: Private credit model tests

on:
  push:
    paths:
      - 'private-credit-underwriting/**'
      - '.github/workflows/private-credit-tests.yml'
  pull_request:
    paths:
      - 'private-credit-underwriting/**'
      - '.github/workflows/private-credit-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: private-credit-underwriting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Regenerate model outputs
        run: python run.py
